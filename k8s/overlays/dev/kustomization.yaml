# minikube on your laptop:  kubectl apply -k k8s/overlays/dev
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - netpol-ollama.yaml
# Week 1: stubs + dummy index. Delete these two lines when the real pipeline is ready.
# Images built locally and loaded with `make images` (minikube image load).
images:
  - name: rahbar-api
    newTag: dev
  - name: rahbar-ui
    newTag: dev
  - name: rahbar-indexer
    newTag: dev
patches:
  - target:
      kind: ConfigMap
      name: rahbar-config
    patch: |-
      - op: replace
        path: /data/OLLAMA_URL
        value: http://192.168.65.254:11434
