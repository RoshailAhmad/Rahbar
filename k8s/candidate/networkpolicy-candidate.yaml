# The candidate api needs what the live api needs: Chroma and Redis (DNS is allowed for all
# pods; Ollama egress is in the dev overlay's egress-to-ollama-host; ingress from the eval Job
# is in api-from-eval). Policies add up, so the live ones are unchanged.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-candidate-egress-to-data
  namespace: rahbar
spec:
  podSelector:
    matchLabels:
      app: api-candidate
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: chroma
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chroma-from-api-candidate
  namespace: rahbar
spec:
  podSelector:
    matchLabels:
      app: chroma
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-candidate
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-from-api-candidate
  namespace: rahbar
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-candidate
      ports:
        - protocol: TCP
          port: 6379
