apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rahbar
labels:
  - pairs:
      app.kubernetes.io/part-of: rahbar
# secret.placeholder.yaml is deliberately NOT listed: applying it would overwrite the
# real Secret created with `make secret`.
resources:
  - namespace.yaml
  - serviceaccounts.yaml
  - configmap.yaml
  - networkpolicy.yaml
  - chroma-statefulset.yaml
  - redis.yaml
  - services.yaml
  - api-deployment.yaml
  - ui-deployment.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - indexer-job.yaml
  - reindex-cronjob.yaml
