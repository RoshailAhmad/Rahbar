# Documents the Secret's SHAPE only. Never apply this file and never list it in
# kustomization.yaml: it would overwrite the real Secret with REPLACE_ME.
# Create the real one from the command line (section 4.7):
#   export LLM_API_KEY=...        # only needed for LLM_PROVIDER=hosted
#   make secret
# which runs:
#   kubectl create secret generic rahbar-secret -n rahbar --from-literal=LLM_API_KEY="$LLM_API_KEY"
# Base64 is encoding, not encryption.
apiVersion: v1
kind: Secret
metadata:
  name: rahbar-secret
  namespace: rahbar
type: Opaque
stringData:
  LLM_API_KEY: REPLACE_ME
