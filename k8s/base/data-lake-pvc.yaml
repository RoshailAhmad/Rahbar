# The data lake (RAGOps paper 4.2.3): incoming files, the verified lake, quarantine,
# archived versions, eval results and traces. A PVC, so all of it survives pod restarts (A3 F1).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-lake
  namespace: rahbar
spec:
  accessModes: [ReadWriteOnce]   # one minikube node, so several pods on it can share it
  resources:
    requests:
      storage: 5Gi
