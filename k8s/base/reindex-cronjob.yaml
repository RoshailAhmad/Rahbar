# Weekly re-index: the same image, env and arguments as the indexer Job.
# Run it now with:  kubectl create job --from=cronjob/reindex manual-reindex-1 -n rahbar
apiVersion: batch/v1
kind: CronJob
metadata:
  name: reindex
  namespace: rahbar
  labels:
    app: indexer
spec:
  # Mondays 02:00 (cluster time, UTC by default)
  schedule: "0 2 * * 1"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 4
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app: indexer
        spec:
          restartPolicy: OnFailure
          serviceAccountName: indexer
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: indexer
              image: rahbar-indexer:dev
              imagePullPolicy: IfNotPresent
              envFrom:
                - configMapRef:
                    name: rahbar-config
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: 1500m
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
