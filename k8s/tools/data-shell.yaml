# A tiny pod that mounts the data-lake PVC, so files can be dropped into /data/incoming:
#   kubectl cp <local-folder>/. rahbar/data-shell:/data/incoming/
# It runs nothing else and never talks to the network (kubectl cp goes through the API server).
apiVersion: v1
kind: Pod
metadata:
  name: data-shell
  namespace: rahbar
  labels:
    app: data-shell
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: shell
      image: busybox:1.36.1
      command: ["sh", "-c", "sleep 2147483647"]
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { cpu: 100m, memory: 64Mi }
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: data-lake
