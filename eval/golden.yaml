  - id: q01
    type: ordinary
    question: What CGPA does an undergraduate need to stay off academic warning?
    relevant:
      - {source: academic-rules-handbook-jun-2026.pdf, section: "5.4"}
    expect: "2.00"

  - id: q02
    type: ordinary
    question: Can a student register for a course after failing its prerequisite?
    relevant:
      - {source: academic-rules-handbook-jun-2026.pdf, section: "prerequisite"}

  - id: q03
    type: ordinary
    question: What happens to a student who stays on academic warning for consecutive semesters?
    relevant:
      - {source: academic-rules-handbook-jun-2026.pdf, section: "5.4"}

  - id: q04
    type: ordinary
    question: How many credit hours can a student take in a summer semester?
    relevant:
      - {source: academic-rules-handbook-jun-2026.pdf, section: "summer"}

  - id: q05
    type: ordinary
    question: How many grade points does a B+ carry?
